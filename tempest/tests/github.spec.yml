name: "GitHub API Explorer"
description: "Explore GitHub's public REST API — no auth required for these endpoints"
options:
  base_uri: "https://api.github.com"

describe:
  - name: "Users"
    describe:
      - name: "Fetch the iconic octocat account"
        description: "octocat is GitHub's mascot — a stable fixture for API testing"
        test:
          route: "/users/octocat"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"
            - "json[\"login\"] != \"\""
            - "body.contains(\"octocat\")"
            - "body.contains(\"San Francisco\")"

      - name: "Non-existent user returns 404"
        test:
          route: "/users/this-user-absolutely-does-not-exist-xyzzy-9999"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 404"

      - name: "List octocat's public repos"
        description: "Includes Hello-World, the canonical first repo"
        test:
          route: "/users/octocat/repos"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"
            - "body.contains(\"Hello-World\")"

      - name: "List octocat's followers"
        test:
          route: "/users/octocat/followers"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"

  - name: "Public Repositories"
    describe:
      - name: "Fetch the octocat/Hello-World repo"
        test:
          route: "/repos/octocat/Hello-World"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"
            - "json[\"name\"] != \"\""
            - "body.contains(\"Hello-World\")"
            - "body.contains(\"octocat\")"

      - name: "List commits on Hello-World"
        description: "Every repo has at least one commit — a safe collection to assert on"
        test:
          route: "/repos/octocat/Hello-World/commits"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"
            - "body.contains(\"commit\")"
            - "body.contains(\"author\")"

      - name: "Non-existent repo returns 404"
        test:
          route: "/repos/octocat/this-repo-does-not-exist-xyzzy"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 404"

  - name: "Fun Endpoints"
    describe:
      - name: "GitHub Zen"
        description: "Returns a random GitHub design principle as plain text"
        test:
          route: "/zen"
          assert:
            - "status == 200"

      - name: "GitHub emoji list contains octocat"
        description: "GitHub maintains a full list of supported emoji — octocat is in there"
        test:
          route: "/emojis"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"
            - "body.contains(\"octocat\")"

      - name: "Gitignore templates list"
        description: "GitHub ships official .gitignore templates for common languages and tools"
        test:
          route: "/gitignore/templates"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"
            - "body.contains(\"Rust\")"
            - "body.contains(\"Python\")"
            - "body.contains(\"Node\")"

      - name: "Rust .gitignore template"
        description: "Fetch the actual Rust gitignore content — assert it includes target/"
        options:
          debug: true
        test:
          route: "/gitignore/templates/Rust"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"
            - "json[\"name\"] != \"\""
            - "body.contains(\"target\")"

  - name: "API Meta"
    describe:
      - name: "Rate limit status"
        description: "Unauthenticated requests get 60 req/hr — this shows the current window"
        test:
          route: "/rate_limit"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - "status == 200"
            - "body.contains(\"rate\")"
            - "body.contains(\"limit\")"
            - "body.contains(\"remaining\")"
