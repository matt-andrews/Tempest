
name: "test a spec"
describe:
  - name: "test 1"
    description: "a simple test"
    test:
      route: "/test/hello?status=200"
      verb: "GET"
      assert:
        - "status == 200"

  - name: "test 2"
    description: "another simple test"
    test:
      route: "/test/hello?status=404"
      verb: "GET"
      assert:
        - "status != 200"
        - "status == 404"