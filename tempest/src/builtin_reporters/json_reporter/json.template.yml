
title_template: |
  { "tests": [

test_template: |
  {% if test_count > '0' or retry_count > '0' %},{%endif%}
    {
      "name": {{ name | json }},
      "status": {{ status }},
      "statusMessage": {{ status_message | json }},
      "duration": {{ duration_ms | round: 2 }},
      "failed": [
        {% assign failed_assertions = assertions | where: "passed", false %}{%- for assert in failed_assertions %}
          {% if assert.passed == false %}{{ assert.expr | json }}{% if assert.error != blank %},{{ assert.error | json }}{% endif %}{% endif %}{% unless forloop.last %}, {% endunless %}
        {%- endfor %}
      ]
    }

error_template: |
  {% if test_count > 1 %},{%endif%}
  { "error": {{ liquid_error_message | json }} }

summary_template: |
    ],
    "summary": {
      "passed": {{ passed }},
      "flaky": {{ flaky }},
      "failed": {{ failed }} 
    }}

file:
  dir: ./tempest-reports
  file_name: report-{{start_timestamp}}.json