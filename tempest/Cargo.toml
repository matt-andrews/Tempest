[package]
name = "tempest"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1.0.102"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
colored = "3.1.1"
enum_dispatch = "0.3.13"
serde_yml = "0.0.12"
reqwest = { version = "0.13.3", features = ["json"] }
serde_json = "1.0.149"
cel-interpreter = "0.10.0"
liquid = "0.26.11"
liquid-core = "0.26.11"
include_dir = "0.7"
async-trait = "0.1.89"

[dev-dependencies]
tempfile = "3.27.0"
mockito = "1.7.2"

[profile.release]
opt-level     = "z"     # optimize for binary size
lto           = "thin"  # cross-crate dead-code elimination; faster than "fat"
codegen-units = 1       # single CGU gives LLVM full-program visibility
strip         = true    # strip debuginfo at link time
panic         = "abort" # drop unwinding machinery (~50–100 KB)