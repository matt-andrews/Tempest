[package]
name = "tempest"
edition = "2024"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
colored = "3.1.1"
enum_dispatch = "0.3.13"
noyalib = { version = "0.0.17", features = ["compat-serde-yaml"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.151"
cel-interpreter = { version = "0.10.0", features = ["json"] }
liquid = "0.26.11"
liquid-core = "0.26.11"
include_dir = "0.7"
async-trait = "0.1.91"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
dunce = "1"
cel-parser = "0.10.1"
scraper = { version = "0.27.0", features = ["atomic"] }
simdxml = "0.2.1"
base64 = "0.23"

[dev-dependencies]
tempfile = "3.27.0"
mockito = "1.7.2"

[profile.release]
opt-level     = "z"     # optimize for binary size
lto           = "thin"  # cross-crate dead-code elimination; faster than "fat"
codegen-units = 1       # single CGU gives LLVM full-program visibility
strip         = true    # strip debuginfo at link time
panic         = "abort" # drop unwinding machinery (~50–100 KB)
