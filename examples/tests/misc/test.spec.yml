name: "Misc tests"

describe:
  - name: "file assertion from same level"
    test:
      route: "http://matthew.andrews.gg/img.jpg"
      assert:
        - 'bytes == fileBytes("img.jpg")'

  - name: "flaky assertion"
    options:
      base_uri: "https://httpbin.org"
      retries: 2
    test:
      route: "/status/{% if retry_attempts == 0 %}400{%else%}200{%endif%}"
      assert:
        - 'status == 200'