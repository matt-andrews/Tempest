name: "VARS mechanics"
description: "test the various mechanics surrounding `vars`"

describe:
  - name: "Flat objects"
    description: "tests with  flat object variables such as status and body"
    options:
      base_uri: "{{ env.HTTPBIN_BASE_URI }}"
    describe:
      - name: "Base64 decode roundtrip"
        description: "httpbin can decode base64 — 'SFRUUEJJTg==' decodes to 'HTTPBIN'"
        test:
          route: "/base64/SFRUUEJJTg=="
          assert:
            - status == 200
            - body == "HTTPBIN"
          vars:
            var_status: status
            var_body: body

      - name: "Variable reading experiment"
        description: "we can read variables published by other tests"
        test:
          route: "/status/{{ vars.var_status }}"
          assert:
            - status == {{ vars.var_status }}
            - "'{{ vars.var_body }}' == 'HTTPBIN'"

  - name: "Headers as vars"
    description: "Tests saving response headers to variables"
    options:
      base_uri: "{{ env.HTTPBIN_BASE_URI }}"
    describe:
      - name: "Accept header is respected"
        test:
          route: "/get"
          headers:
            Accept: "application/json"
          assert:
            - status == 200
            - headers["content-type"] == "application/json"
          vars:
            fwdContentType: headers["content-type"]
      - name: "Custom header is echoed"
        test:
          route: "/get"
          headers:
            X-Tempest-Test: "{{ vars.fwdContentType }}"
          assert:
            - status == 200
            - body.contains("application/json")
            - '"{{ vars.fwdContentType }}" == "application/json"'

  - name: "Json objects"
    description: "tests saving variables from complex json objects"
    options:
      base_uri: "{{ env.GITHUB_BASE_URI }}"
    describe:
      - name: "Fetch the octocat/Hello-World repo"
        test:
          route: "/repos/octocat/Hello-World"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - status == 200
            - body.json().name == "Hello-World"
            - body.json().owner.login == "octocat"
          vars:
            github_user: body.json().owner.login
            github_repo: body.json().name

      - name: "Fetch the octocat/Hello-World repo dynamically"
        test:
          route: "/repos/{{ vars.github_user }}/{{ vars.github_repo }}"
          headers:
            Accept: "application/vnd.github.v3+json"
          assert:
            - status == 200
            - body.json().name == "Hello-World"
            - body.json().owner.login == "octocat"

  - name: "let tests"
    description: "tests that validate the `let` feature"
    options:
      base_uri: "{{ env.JSON_PLACEHOLDER_BASE_URI }}"
    describe:
      - name: "List albums"
        test:
          route: "/albums"
          let:
            json: body.json()
            albumMap: let.json.filter(album, album.userId == 10).map(album, album.id)
            status: status
          assert:
            - status == 200u && let.json.size() == 100
            - let.json.all(album, album.title.size() > 0 && album.id >= 1 && album.id <= 100)
            - let.albumMap == [91, 92, 93, 94, 95, 96, 97, 98, 99, 100]
          vars:
            test_var_with_let: let.status

      - name: "var passed using let"
        test:
          route: "{{ env.HTTPBIN_BASE_URI }}/status/{{ vars.test_var_with_let }}"
          assert:
            - status == 200
