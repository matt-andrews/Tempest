name: "Misc tests"

describe:
  - name: "file assertion from same level"
    test:
      route: "http://matthew.andrews.gg/img.jpg"
      assert:
        - bytes == fileBytes("img.jpg")

  - name: "test bytes to base64"
    test:
      route: "https://github.githubassets.com/images/icons/emoji/unicode/1f4a4.png?v8"
      assert:
        - bytes.toBase64() == ""
      vars:
        zzz_base64: bytes.toBase64()

  - name: "test base64 to bytes"
    test:
      route: "https://github.githubassets.com/images/icons/emoji/unicode/1f4a4.png?v8"
      assert:
        - bytes.toBase64() == "{{ vars.zzz_base64 }}"
        - '"{{ vars.zzz_base64 }}".fromBase64() == bytes'

  - name: "testing `skip` option"
    options:
      skip: true
    test:
      route: "https://github.githubassets.com/images/icons/emoji/unicode/1f4a4.png?v8"
      assert:
        - status == 201

  #test the viability of a templated boolean.
  #this test will run once and intentionally fail the assertion.
  #and on retry != 0 we skip
  - name: "testing `skip` option with liquid templates"
    options:
      skip: '{% if retry_attempts == 0 %}false{% else %}true{% endif %}'
    test:
      route: "https://github.githubassets.com/images/icons/emoji/unicode/1f4a4.png?v8"
      assert:
        - status == 0

  #test that verifies the "broken" environment variable is loaded up as intended
  - name: "issue#66 env regression  test"
    test:
      route: "https://github.githubassets.com/images/icons/emoji/unicode/1f4a4.png?v8"
      assert:
        - "'{{ env.TEST_ENV_WITH_SPACES }}' == 'My Env Has Spaces'"