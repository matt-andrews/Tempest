name: Publish - App

on:
  push:
    tags:
      - "app/v*"

permissions:
  contents: read

jobs:
  unit-test:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-test-unit.yml
  integration-test:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-test-integration.yml

  publish-app:
    needs:
      - unit-test
      - integration-test

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#app/}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./tempest
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tempest:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tempest:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/tempest
          readme-filepath: ./DOCKER_HUB_README.md

  create-release:
    needs: [publish-app]
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/reusable-create-release.yml
    with:
      tag: ${{ github.ref_name }}
      area_labels: "area: core"
      make_latest: true
      prerelease: false
