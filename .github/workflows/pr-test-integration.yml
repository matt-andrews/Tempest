name: PR - integration tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "tempest/**"
      - "examples/**"
      - ".github/workflows/pr-test-integration.yml"

jobs:
  build:
    name: Build integration test binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./tempest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tempest-integration-binary
          path: ./tempest/target/debug/tempest
          retention-days: 1
          compression-level: 0
          if-no-files-found: error


  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: passing scenario
            dir: ./pass
            strict: false
            retries: 2
            expect: 0
          - name: failing scenario
            dir: ./fail
            strict: false
            retries: 2
            expect: 1
          - name: flaky scenario (strict)
            dir: ./flaky
            strict: true
            retries: 2
            expect: 2
          - name: flaky scenario (non-strict)
            dir: ./flaky
            strict: false
            retries: 2
            expect: 0


      name: Integration tests - ${{ matrix.name }}
      runs-on: ubuntu-latest
      permissions:
        contents: read
      defaults:
        run:
          working-directory: ./tempest

      steps:
        - uses: actions/checkout@v7

        - name: Download binary
          uses: actions/download-artifact@v8
          with:
            name: tempest-integration-binary
            path: ./tempest/bin

        - name: Run
          shell: bash
          run: |
            chmod +x ./bin/tempest
            
            args=(
              test
              --path ../examples/tests
              --run "${{ matrix.dir }}"
              --retries "${{ matrix.retries }}"
            )
            
            if [[ "${{ matrix.strict }}" == "true" ]]; then
              args+=(--strict)
            fi
            
            actual=0
            ./bin/tempest "${args[@]}" || actual=$?
            
            if [[ "$actual" -ne "${{ matrix.expect }}" ]]; then
              echo "::error::Expected exit code ${{ matrix.expect }}, got $actual"
              exit 1
            fi